# 本地与生产同一份
# 凭证与库名来自 .env；数据目录 ./docker-volumes/（已 gitignore）
x-timezone: &timezone
  TZ: Asia/Shanghai

services:
  # Prisma：用户、会话、消息、记忆元数据、ConsolidationJob 等
  mysql:
    image: mysql:8.4
    container_name: lilia-mysql
    restart: unless-stopped
    environment:
      <<: *timezone
      MYSQL_ROOT_PASSWORD: ${DATABASE_PASSWORD}
      MYSQL_DATABASE: ${DATABASE_NAME}
    ports:
      - '127.0.0.1:3306:3306'
    volumes:
      - ./docker-volumes/mysql-data:/var/lib/mysql

  # 向量库：UserMemory 的 embedding 检索
  chromadb:
    image: chromadb/chroma:latest
    container_name: lilia-chroma
    restart: unless-stopped
    environment:
      <<: *timezone
    ports:
      - '127.0.0.1:8000:8000'
    volumes:
      - ./docker-volumes/chroma-data:/data

  # 日志接收：pino → Loki；配置见 docker/loki-config.yml
  loki:
    image: grafana/loki:3.7
    container_name: lilia-loki
    restart: unless-stopped
    environment:
      <<: *timezone
    ports:
      - '127.0.0.1:3100:3100'
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./docker/loki-config.yml:/etc/loki/loki-config.yml:ro
      - ./docker-volumes/loki-data:/loki

  # 日志查询 UI：http://localhost:3001（admin/password）
  grafana:
    image: grafana/grafana:latest
    container_name: lilia-grafana
    restart: unless-stopped
    depends_on:
      - loki
    ports:
      - '127.0.0.1:3001:3000'
    environment:
      <<: *timezone
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: password
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - ./docker-volumes/grafana-data:/var/lib/grafana
      - ./docker/grafana-loki-datasource.yml:/etc/grafana/provisioning/datasources/loki.yml:ro

  # BullMQ / ioredis（REDIS_URL）；AOF 持久化延迟任务与队列状态
  redis:
    image: redis:8.8
    container_name: lilia-redis
    restart: unless-stopped
    environment:
      <<: *timezone
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - ./docker-volumes/redis-data:/data
    command: redis-server --appendonly yes

  # 对象存储：头像等上传（S3 兼容）。
  seaweedfs:
    image: chrislusf/seaweedfs:4.46
    container_name: lilia-seaweedfs
    restart: unless-stopped
    environment:
      <<: *timezone
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
    ports:
      - '127.0.0.1:8333:8333'
    volumes:
      - ./docker-volumes/seaweedfs-data:/data
    command: mini -dir=/data
